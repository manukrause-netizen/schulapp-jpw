function rerenderItem(id){const it=curBoard().items.find(x=>x.id===id),el=document.querySelector(`.wdg[data-id="${id}"]`);if(!it||!el)return;try{el.querySelector('.wb').innerHTML=WT[it.type].r(it);WT[it.type].mount&&WT[it.type].mount(el,it);WT[it.type].tick&&WT[it.type].tick(el,it)}catch(_){setTimeout(()=>rerenderItem(id),0)}}
function wdgHTML(it){const T=WT[it.type];return `<div class="wdg" data-id="${it.id}" style="left:${it.x}px;top:${it.y}px;width:${it.w}px;height:${it.h}px"><div class="wh" data-drag><span class="wt">${T.n}</span><span class="wtools">${T.tools||''}<button data-wact="del" aria-label="Baustein entfernen">×</button></span></div><div class="wb">${T.r(it)}</div><span class="wr" data-resize aria-hidden="true"></span></div>`}
function fitBoard(){const wrap=document.getElementById('wbWrap'),bd=document.getElementById('wbBoard');if(!wrap||!bd)return;
  if(wbPresent){wbScale=Math.min(innerWidth/BW,innerHeight/BH);bd.style.left=((innerWidth-BW*wbScale)/2)+'px';bd.style.top=((innerHeight-BH*wbScale)/2)+'px'}else{wbScale=wrap.clientWidth/BW;bd.style.left='0';bd.style.top='0';wrap.style.height=(BH*wbScale)+'px'}
  bd.style.transform=`scale(${wbScale})`}
function renderBoardItems(){const b=curBoard(),bd=document.getElementById('wbItems');bd.innerHTML=b.items.map(wdgHTML).join('');b.items.forEach(it=>{const el=bd.querySelector(`.wdg[data-id="${it.id}"]`);WT[it.type].mount&&WT[it.type].mount(el,it);WT[it.type].tick&&WT[it.type].tick(el,it)});loadDrawing()}

  if(ln&&ln.mode==='punkte'){const n=Number(String(v).replace(',','.'));if(!isFinite(n))return null;const pct=n/ln.max*100;const key=ln.key||DEF_KEY;for(let i=0;i<5;i++)if(pct>=key[i])return i+1;return 6}
  const s=String(v).trim().replace(',','.');let m=s.match(/^([1-6])\s*([+-])?$/);if(m){let g=Number(m[1]);if(m[2]==='+')g-=S.grades.tend;if(m[2]==='-')g+=S.grades.tend;return Math.min(6,Math.max(1,g))}

function inkSaveCanvas(){const c=document.getElementById('inkCanvas');if(!c||!talkDraft)return;const x=c.getContext('2d'),data=x.getImageData(0,0,INK_W,INK_H).data;let blank=true;for(let i=3;i<data.length;i+=64){if(data[i]){blank=false;break}}
  while(talkDraft.ink.length<=inkPage)talkDraft.ink.push('');talkDraft.ink[inkPage]=blank?'':c.toDataURL('image/png')}
function inkLoad(){const c=document.getElementById('inkCanvas');if(!c)return;const x=c.getContext('2d');x.clearRect(0,0,INK_W,INK_H);const src=talkDraft.ink[inkPage];if(src){const im=new Image();im.onload=()=>x.drawImage(im,0,0);im.src=src}inkUndo=[]}

let inkStroke=null;
document.addEventListener('pointerdown',e=>{if(e.target.id!=='inkCanvas')return;if(e.pointerType==='pen')inkSeenPen=true;if(inkSeenPen&&e.pointerType==='touch')return;
  const c=e.target,r=c.getBoundingClientRect(),x=c.getContext('2d');inkUndo.push(x.getImageData(0,0,INK_W,INK_H));if(inkUndo.length>20)inkUndo.shift();
  const pt=ev=>[(ev.clientX-r.left)/r.width*INK_W,(ev.clientY-r.top)/r.height*INK_H,ev.pointerType==='pen'&&ev.pressure>0?ev.pressure:.5];
  x.lineCap='round';x.lineJoin='round';x.globalCompositeOperation=inkPen.erase?'destination-out':'source-over';x.strokeStyle=inkPen.c;
  const [sx,sy]=pt(e);inkStroke={x,pt,last:[sx,sy],id:e.pointerId};x.beginPath();x.arc(sx,sy,(inkPen.erase?14:inkPen.w*.6),0,Math.PI*2);x.fillStyle=inkPen.c;if(!inkPen.erase)x.fill();c.setPointerCapture(e.pointerId);e.preventDefault()},{passive:false});
document.addEventListener('pointermove',e=>{if(!inkStroke||e.pointerId!==inkStroke.id)return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  evs.forEach(ev=>{const [x,y,p]=inkStroke.pt(ev);const s=inkStroke.x;s.lineWidth=inkPen.erase?28:inkPen.w*(.55+p*1.1);s.beginPath();s.moveTo(inkStroke.last[0],inkStroke.last[1]);s.lineTo(x,y);s.stroke();inkStroke.last=[x,y]});e.preventDefault()},{passive:false});
document.addEventListener('pointerup',e=>{if(inkStroke&&e.pointerId===inkStroke.id){inkStroke=null;inkSaveCanvas()}});
document.addEventListener('pointercancel',()=>{inkStroke=null});
document.addEventListener('touchmove',e=>{if(e.target.id==='inkCanvas')e.preventDefault()},{passive:false});
document.addEventListener('change',e=>{if(e.target.id!=='tPhoto')return;const files=[...e.target.files];if(!files.length)return;
  Promise.all(files.map(f=>new Promise(res=>{const r=new FileReader(),img=new Image();r.onload=()=>{img.onload=()=>{const s=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};img.onerror=()=>res(null);img.src=r.result};r.readAsDataURL(f)})))
  .then(list=>{talkDraft.photos=[...(talkDraft.photos||[]),...list.filter(Boolean)];talkRerender();toast(list.length>1?list.length+' Fotos hinzugefügt':'Foto hinzugefügt')});e.target.value=''});
function talkAct(act,a){
  if(act==='ink-c'){inkPen.c=a.dataset.c;inkPen.erase=false;talkRerender()}
  else if(act==='ink-w'){inkPen.w=Number(a.dataset.w);inkPen.erase=false;talkRerender()}
  else if(act==='ink-er'){inkPen.erase=!inkPen.erase;talkRerender()}
  else if(act==='ink-undo'){const c=document.getElementById('inkCanvas'),u=inkUndo.pop();if(u){c.getContext('2d').putImageData(u,0,0);inkSaveCanvas()}}
  else if(act==='ink-clear'){const c=document.getElementById('inkCanvas'),x=c.getContext('2d');inkUndo.push(x.getImageData(0,0,INK_W,INK_H));x.clearRect(0,0,INK_W,INK_H);inkSaveCanvas()}
  else if(act==='ink-prev'){inkSaveCanvas();inkPage=Math.max(0,inkPage-1);talkRerender()}
  else if(act==='ink-next'){inkSaveCanvas();if(inkPage>=talkDraft.ink.length-1){if(!talkDraft.ink[inkPage]){toast('Die aktuelle Seite ist noch leer');return}talkDraft.ink.push('')}inkPage++;talkRerender()}
  else if(act==='pho-del'){talkReadFields();inkSaveCanvas();talkDraft.photos.splice(Number(a.dataset.i),1);talkRerender()}
  else if(act==='pho-view'){const v=document.getElementById('phView'),src=talkDraft.photos[Number(a.dataset.i)];v.innerHTML=`<div class="phbig"><img alt="Foto der Papiernotiz" src="${src}"><button class="inkb" data-act="pho-close">Schließen</button></div>`;v.scrollIntoView({behavior:'smooth',block:'nearest'})}
  else if(act==='pho-close'){document.getElementById('phView').innerHTML=''}
}

    {const wl=g('haL')&&g('haL').checked;let l=it.list?S.lists.find(x=>x.id===it.list):null;

/* ICS und Feed */
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/([,;])/g,'\\$1')}
function icsFold(l){const enc=new TextEncoder(),out=[];let cur='',n=0;for(const ch of l){const b=enc.encode(ch).length;if(n+b>74){out.push(cur);cur=' ';n=1}cur+=ch;n+=b}out.push(cur);return out.join('\r\n')}
function haFeedItems(o){const k=haClass(),t=iso(today0());const ok=x=>(!o.app||x.sent);
  return{k,hw:haIn(S.hw,k).filter(h=>ok(h)&&h.due>=t).sort((a,b)=>a.due.localeCompare(b.due)),pr:haIn(S.proben,k).filter(p=>ok(p)&&p.date>=t).sort((a,b)=>a.date.localeCompare(b.date))}}
function haICS(o){const {k,hw,pr}=haFeedItems(o),stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const nx=s=>{const d=parseISO(s);d.setDate(d.getDate()+1);return iso(d).replace(/-/g,'')};
  const ev=(u,s,sum,desc)=>['BEGIN:VEVENT','UID:'+u+'@schulapp-jpw','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+s.replace(/-/g,''),'DTEND;VALUE=DATE:'+nx(s),'SUMMARY:'+icsEsc(sum),...(desc?['DESCRIPTION:'+icsEsc(desc)]:[]),'TRANSP:TRANSPARENT','END:VEVENT'];
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//JPW Theres//SchulApp//DE','CALSCALE:GREGORIAN','X-WR-CALNAME:'+icsEsc('Hausaufgaben und Proben '+(k==='alle'?'':k)),
    ...hw.flatMap(h=>ev('ha-'+h.id,h.due,`HA ${fach(h.f).n}${k==='alle'?' ('+h.k+')':''}: ${h.t}`,h.no)),
    ...pr.flatMap(p=>ev('pr-'+p.id,p.date,`Probe ${fach(p.f).n}${k==='alle'?' ('+p.k+')':''}: ${p.t}`,p.no)),'END:VCALENDAR'];
  return lines.map(icsFold).join('\r\n')+'\r\n'}
function haFeed(o){const {k,hw,pr}=haFeedItems(o);return JSON.stringify({typ:'SchulApp-JPW-Klassenfeed',version:1,schule:S.school,klasse:k,stand:new Date().toISOString(),

function prPlan(k){

  const wkWarn=wk=>{const s=iso(wk[0]);const per={};list.forEach(p=>{if(weekKey(p.date)===s)per[p.k]=(per[p.k]||0)+1});const w=Object.entries(per).filter(([,n])=>n>2);return w.length?`<div class="prwk">${w.map(([kk,n])=>`<span class="tag warn">${kk}: ${n} Proben in dieser Woche</span>`).join(' ')}</div>`:''};

    <h2>${prMon.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}${k==='alle'?'':' · '+esc(k)}</h2>

function zgJustify(doc,text,x,w,lh,st){const SH='\u00AD',cl=t=>t.split(SH).join('');const sp=doc.getTextWidth(' ');const words=String(text).split(/\s+/).filter(Boolean);const lines=[];let cur=[],cw=0;
  const push=(last)=>{if(cur.length)lines.push({ws:cur,last});cur=[];cw=0};
  let i=0;while(i<words.length){let wd=words[i];const ww=doc.getTextWidth(cl(wd));const need=(cur.length?cw+sp:0)+ww;
    if(need<=w){cur.push(cl(wd));cw=need;i++;continue}
    const parts=wd.split(SH);let best=-1;for(let k=parts.length-1;k>=1;k--){const pre=parts.slice(0,k).join('')+'-';if((cur.length?cw+sp:0)+doc.getTextWidth(pre)<=w){best=k;break}}
    if(best>0){cur.push(parts.slice(0,best).join('')+'-');push(false);words[i]=parts.slice(best).join(SH);continue}
    if(!cur.length){cur.push(cl(wd));cw=ww;i++;push(false);continue}
    push(false)}
  push(true);
  lines.forEach(L=>{st.need(lh);if(L.last||L.ws.length<2){doc.text(L.ws.join(' '),x,st.y)}else{const tw=L.ws.reduce((a,t)=>a+doc.getTextWidth(t),0);const gap=(w-tw)/(L.ws.length-1);let xx=x;L.ws.forEach(t=>{doc.text(t,xx,st.y);xx+=doc.getTextWidth(t)+gap})}st.y+=lh})}
